[package]
name = "mirage_rs"
version = "0.1.0"
edition = "2021"
description = "MIRAGE_fast: Rust implementation of MIRAGE (Mutation-encoded Inference of RNA Activity via Generative Effects)"
license = "MIT"
repository = "https://github.com/yangli04/MIRAGE_fast"
authors = ["Yang Li <yliuchicago@uchicago.edu>"]

[lib]
name = "mirage_rs"
path = "src/lib.rs"

[[bin]]
name = "mirage"
path = "src/bin/mirage.rs"

[dependencies]
statrs = "0.18"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
csv = "1.3"
serde = { version = "1", features = ["derive"] }
itertools = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
